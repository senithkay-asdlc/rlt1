openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Create todos and mark them done, private per signed-in user.
servers:
  - url: /
paths:
  /me/todos:
    get:
      operationId: listMyTodos
      summary: The caller's todos
      security:
        - oauth2: [todos:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's todos
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Todo' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyTodo
      summary: Create a todo
      security:
        - oauth2: [todos:create]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: the todo's text }
      responses:
        '201':
          description: The created todo, not done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400':
          description: Missing or empty text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/todos/{todoId}/complete:
    post:
      operationId: completeMyTodo
      summary: Mark one of the caller's todos as done
      security:
        - oauth2: [todos:complete]
      parameters:
        - name: todoId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The todo, now marked done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '404':
          description: No such todo for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            todos:read: The caller's own todos
            todos:create: Create a new todo
            todos:complete: Mark the caller's todo as done
  schemas:
    Todo:
      type: object
      required: [id, text, done, createdAt]
      properties:
        id: { type: string }
        text: { type: string }
        done: { type: boolean }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
